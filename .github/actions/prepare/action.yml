description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 12.16.1
    - uses: actions/setup-node@v7
      with:
        node-version: '26.13.0'
        cache: pnpm
    - run: pnpm install
      shell: bash
  using: composite